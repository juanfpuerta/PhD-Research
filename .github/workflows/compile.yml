name: Build Manuscripts and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Main Thesis Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Thesis/Thesis_Main_Structure.tex
          work_in_root_file_dir: true
          compiler: latexmk
          args: -pdf -file-line-error -interaction=nonstopmode -f

      - name: Stage Deployment Directory
        run: |
          mkdir -p public
          # Copy compiled PDF from the Thesis directory
          cp Thesis/Thesis_Main_Structure.pdf public/Thesis_Main_Structure.pdf
          # Copy website files and static assets
          cp index.html public/ 2>/dev/null || true
          cp *.png public/ 2>/dev/null || true

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Production Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy Directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4